services:
  - type: web
    name: paytm-saathi-web-api
    runtime: python
    plan: free
    region: singapore
    branch: web
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: paytm-saathi
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://ai-business-partner-for-merchants.vercel.app"]'
      - key: PROVIDER_MODE
        value: sandbox
